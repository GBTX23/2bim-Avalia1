<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Escolha um número entre 1 e 100. Cada número gera uma figura diferente, assinada com o seu e-mail.</p>
    </header>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="42">

      <button type="submit">Desenhar</button>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>

 <script src="script.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<div id="g_id_onload"
     data-client_id="249734464215-apsrsngjulinaqfeacpsnur5jp5oq3p0.apps.googleusercontent.com"
     data-callback="aoLogar"
     data-auto_prompt="false"></div>
<div class="g_id_signin" data-type="standard"></div>
</body>
</html>
